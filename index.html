<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="game.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
</head>
<body>
    <p style="font-size: large; font-weight: 600; color: rgb(52, 166, 251); text-align: center;">
        My Platform Game
    </p>
    <div id="results" style="display: flex; align-items: center; flex-wrap: wrap;">
        <p id="status" style="font-size: large; color: green; font-weight: 600"></p>
        <button id="restart" style="cursor: pointer; border: 1px solid wheat; background-color: rgb(52, 166, 251); color: white; padding: 4px 8px; border-radius: 8px;">
            restart level
        </button>
        <p style="color: gray; margin: 6px 0;">Collect the coins (yellow boxes) to win a level.</p>
    </div>
    <div id="game-cont">

    </div>
    <div style="margin-top: 16px;">
        <div style="display: flex; justify-content: space-evenly; max-width: 767px;">
            <button id="left" style="background-color: rgb(52, 166, 251); color: white; border: 1px solid gray; padding: 8px;">left</button>
            <button id="up" style="background-color: rgb(52, 166, 251); color: white; border: 1px solid gray; padding: 8px;">up</button>
            <button id="right" style="background-color: rgb(52, 166, 251); color: white; border: 1px solid gray; padding: 8px;">right</button>
        </div>
        <p style="font-size: small; color: gray; text-align: center;">use keyboard arrows on pc</p>
    </div>
    <script type="module" src="./run-game.js"></script>
</body>
</html>
